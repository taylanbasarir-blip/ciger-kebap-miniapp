</style></head><body><div class="shell"><header class="hero"><div class="herohead"><div><div class="eyebrow">FROM TARSUS TO TIVAT</div><h1>1 Ciğer &amp; 1 Kebap</h1><p id="subtitle">Turkish charcoal grill · Tivat</p></div><select class="lang" id="lang"><option value="en">EN</option><option value="me">ME</option><option value="ru">RU</option></select></div></header><section class="delivery"><strong id="direct"></strong><span id="places"></span></section><main id="content"></main><nav class="bottom"><button id="menuTab" class="nav active">☰ <span id="menuLabel">Menu</span></button><button id="cartTab" class="nav">🛒 <span id="cartLabel">Cart</span></button><button id="cartCount" class="cart-pill">0 · 0 €</button></nav></div><script>
const products=[{"id":1,"cat":"kebab","price":20,"tr":"Kuzu Şiş","en":"Lamb Shish","me":"Jagnjeći ražnjići","ru":"Шашлык из баранины","img":"images/lamb-shish.jpg"},{"id":2,"cat":"kebab","price":20,"tr":"Adana Kebap (Kuzu)","en":"Adana Kebab (Lamb)","me":"Adana kebab (jagnjetina)","ru":"Адана-кебаб из баранины","img":"images/adana.jpg"},{"id":3,"cat":"kebab","price":15,"tr":"Kuzu Ciğer Şiş","en":"Lamb Liver Shish","me":"Ražnjići od jagnjeće džigerice","ru":"Шашлык из бараньей печени","img":"images/liver.jpg"},{"id":4,"cat":"kebab","price":15,"tr":"Tavuk Şiş","en":"Chicken Shish","me":"Pileći ražnjići","ru":"Куриный шашлык","img":"images/chicken-shish.jpg"},{"id":5,"cat":"tantuni","price":10,"tr":"Ekmek Arası Et Tantuni","en":"Beef Tantuni Sandwich","me":"Sendvič s goveđim tantunijem","ru":"Тантуни с говядиной (сэндвич)","img":"images/beef-sandwich.jpg"},{"id":6,"cat":"tantuni","price":9,"tr":"Et Tantuni Dürüm","en":"Beef Tantuni Wrap","me":"Goveđi tantuni u lavašu","ru":"Тантуни с говядиной (лаваш)","img":"images/beef-wrap.jpg"},{"id":7,"cat":"tantuni","price":9,"tr":"Ekmek Arası Tavuk Tantuni","en":"Chicken Tantuni Sandwich","me":"Pileći tantuni sendvič","ru":"Тантуни с курицей (сэндвич)","img":"images/chicken-sandwich.jpg"},{"id":8,"cat":"tantuni","price":8,"tr":"Tavuk Tantuni Dürüm","en":"Chicken Tantuni Wrap","me":"Pileći tantuni u lavašu","ru":"Тантуни с курицей (лаваш)","img":"images/chicken-wrap.jpg"},{"id":9,"cat":"other","price":6,"tr":"Lahmacun","en":"Lahmacun","me":"Lahmadžun","ru":"Лахмаджун","img":"images/lahmacun.jpg"},{"id":11,"cat":"tantuni","price":12,"tr":"Yoğurtlu Tavuk Tantuni","en":"Chicken Tantuni with Yogurt","me":"Pileći tantuni s jogurtom","ru":"Куриный тантуни с йогуртом","img":"images/chicken-yogurt.jpg"},{"id":12,"cat":"meze","price":10,"tr":"Humus","en":"Hummus","me":"Humus","ru":"Хумус","img":"images/hummus.jpg?v=2"},{"id":13,"cat":"meze","price":10,"tr":"Babagannuş","en":"Babaganoush","me":"Babaganuš","ru":"Бабагануш","img":"images/bab const translations={
en:{subtitle:'Turkish charcoal grill · Tivat',direct:'Direct ordering · Restaurant prices',places:'Tivat · Kotor · Herceg Novi | Daily 11:00–22:00',all:'All',kebab:'Kebabs',tantuni:'Tantuni',other:'Lahmacun',meze:'Mezes',salad:'Sides',drink:'Drinks',menu:'Menu',cart:'Cart',items:'items',empty:'Your cart is empty',sum:'Total',name:'Your name',phone:'Phone number',zone:'Delivery area',address:'Delivery address',notes:'Notes (optional)',send:'Send order request',choose:'Select area',a:'Tivat center / nearby',b:'Other Tivat areas',c:'Kotor',d:'Herceg Novi',warn:'Orders are sent to the restaurant for confirmation.',min:'Tivat center: minimum 20 €. Other areas: subject to confirmation.',missing:'Enter name, phone, delivery area and address.',below:'Minimum order for Tivat center is 20 €.',sent:'Order request sent. Await restaurant confirmation.'},
me:{subtitle:'Turska jela sa roštilja · Tivat',direct:'Direktno naručivanje · Cijene iz restorana',places:'Tivat · Kotor · Herceg Novi | Svaki dan 11:00–22:00',all:'Sve',kebab:'Kebabi',tantuni:'Tantuni',other:'Lahmadžun',meze:'Meze',salad:'Prilozi',drink:'Pića',menu:'Meni',cart:'Korpa',items:'proizvoda',empty:'Korpa je prazna',sum:'Ukupno',name:'Ime',phone:'Telefon',zone:'Zona dostave',address:'Adresa dostave',notes:'Napomene (opciono)',send:'Pošalji zahtjev za narudžbinu',choose:'Izaberite zonu',a:'Centar Tivta / blizina',b:'Ostali djelovi Tivta',c:'Kotor',d:'Herceg Novi',warn:'Zahtjevi se šalju restoranu na potvrdu.',min:'Centar Tivta: minimum 20 €. Ostale zone: uz potvrdu.',missing:'Unesite ime, telefon, zonu i adresu.',below:'Minimalna narudžbina za centar Tivta je 20 €.',sent:'Zahtjev za narudžbinu je poslat. Sačekajte potvrdu restorana.'},

};
const workerURL='https://ciger-kebap-orders.taylanbasarir.workers.dev/order';
const $=id=>document.getElementById(id);const state={lang:'en',cat:'all',page:'menu',cart:{}};
const t=k=>translations[state.lang][k];const money=n=>n.toFixed(2).replace('.00','')+' €';const total=()=>products.reduce((sum,p)=>sum+p.price*(state.cart[p.id]||0),0);const count=()=>Object.values(state.cart).reduce((s,q)=>s+q,0);
function save(){try{localStorage.setItem('ciger_demo_cart',JSON.stringify(state.cart));localStorage.setItem('ciger_demo_lang',state.lang)}catch(e){}}
try{state.cart=JSON.parse(localStorage.getItem('ciger_demo_cart')||'{}');state.lang=localStorage.getItem('ciger_demo_lang')||'en';}catch(e){};
if(!translations[state.lang])state.lang='en';for(const key of Object.keys(state.cart)){if(!products.some(p=>p.id===Number(key)))delete state.cart[key]};$('lang').value=state.lang;
function sync(){['subtitle','direct','places'].forEach(k=>$(k).textContent=t(k));$('menuLabel').textContent=t('menu');$('cartLabel').textContent=t('cart');$('cartCount').textContent=count()+' · '+money(total());$('menuTab').classList.toggle('active',state.page==='menu');$('cartTab').classList.toggle('active',state.page==='cart')}
function add(id,delta=1){state.cart[id]=Math.max(0,(state.cart[id]||0)+delta);if(!state.cart[id])delete state.cart[id];save();render()}
function menu(){const cats=['all','kebab','tantuni','other','meze','salad','drink'];const visible=products.filter(p=>state.cat==='all'||p.cat===state.cat);$('content').innerHTML=`<div class="cats">${cats.map(c=>`<button class="${c===state.cat?'active':''}" data-cat="${c}">${t(c)}</button>`).join('')}</div><div class="heading"><h2>${t(state.cat)}</h2><small>${visible.length} ${t('items')}</small></div><div class="products">${visible.map(p=>`<article class="item">${p.img?`<img src="${p.img}" alt="${p[state.lang]}" loading="lazy">`:'<div class="art">🥗</div>'}<div class="info"><h3>${p[state.lang]}</h3><div class="buy"><strong>${money(p.price)}</strong><button class="add" data-add="${p.id}" aria-label="Add ${p.en}">+</button></div></div></article>`).join('')}</div>`;document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{state.cat=b.dataset.cat;render()});document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>add(Number(b.dataset.add)))}
function cart(){const selected=products.filter(p=>state.cart[p.id]);$('content').innerHTML=`<div class="panel"><h2>${t('cart')}</h2><div class="notice">${t('warn')}</div>${selected.map(p=>`<div class="cartrow"><div><b>${p[state.lang]}</b><div>${money(p.price)}</div></div><div class="qty"><button data-less="${p.id}">−</button><b>${state.cart[p.id]}</b><button data-more="${p.id}">+</button></div></div>`).join('')||`<p class="empty">${t('empty')}</p>`}<div class="total"><span>${t('sum')}</span><span>${money(total())}</span></div><p class="help">${t('min')}</p><label class="field">${t('name')}<input id="customer" autocomplete="name"></label><label class="field">${t('phone')}<input id="phone" inputmode="tel" autocomplete="tel" placeholder="+382..."></label><label class="field">${t('zone')}<select id="zone"><option value="">${t('choose')}</option>${['a','b','c','d'].map(z=>`<option value="${z}">${t(z)}</option>`).join('')}</select></label><label class="field">${t('address')}<textarea id="address"></textarea></label><label class="field">${t('notes')}<textarea id="notes"></textarea></label><button class="primary" id="send" ${!selected.length?'disabled':''}>${t('send')}</button><div class="result" id="result"></div></div>`;document.querySelectorAll('[data-less]').forEach(b=>b.onclick=()=>add(Number(b.dataset.less),-1));document.querySelectorAll('[data-more]').forEach(b=>b.onclick=()=>add(Number(b.dataset.more)));$('send').onclick=submit}
async function submit(){let name=$('customer').value.trim(),phone=$('phone').value.trim(),zone=$('zone').value,address=$('address').value.trim(),notes=$('notes').value.trim();if(!name||!phone||!zone||!address){alert(t('missing'));return}if(zone==='a'&&total()<20){alert(t('below'));return}const initData=window.Telegram?.WebApp?.initData||'';if(!initData){alert('Open this menu from the Telegram bot to send an order.');return}const b=$('send');b.disabled=true;b.textContent='…';try{let r=await fetch(workerURL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData,name,phone,zone,address,notes,items:products.filter(p=>state.cart[p.id]>0).map(p=>({id:p.id,qty:state.cart[p.id]}))})});let j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'Order failed');state.cart={};save();$('result').textContent=t('sent');b.textContent=t('sent');$('cartCount').textContent='0 · 0 €'}catch(e){alert(e.message);b.disabled=false;b.textContent=t('send')}}
function render(){sync();state.page==='menu'?menu():cart()}$('lang').onchange=e=>{state.lang=e.target.value;save();render()};$('menuTab').onclick=()=>{state.page='menu';render();window.scrollTo(0,0)};$('cartTab').onclick=$('cartCount').onclick=()=>{state.page='cart';render();window.scrollTo(0,0)};render();window.Telegram?.WebApp?.ready();
</script></body></html>
