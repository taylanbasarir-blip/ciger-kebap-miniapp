const $=id=>document.getElementById(id);const state={lang:'en',cat:'all',page:'menu',cart:{}};
const profileKey=()=>{const id=window.Telegram?.WebApp?.initDataUnsafe?.user?.id;return 'ciger_profile_v1_'+(id?String(id):'device')};
function loadProfile(){try{const p=JSON.parse(localStorage.getItem(profileKey())||'{}');return {name:String(p.name||''),phone:String(p.phone||''),zone:['a','b','c','d'].includes(p.zone)?p.zone:'',address:String(p.address||'')}}catch{return {name:'',phone:'',zone:'',address:''}}}
function saveProfile(p){try{localStorage.setItem(profileKey(),JSON.stringify({name:String(p.name).slice(0,100),phone:String(p.phone).slice(0,60),zone:p.zone,address:String(p.address).slice(0,400)}));return true}catch{return false}}
const t=k=>translations[state.lang][k];const money=n=>n.toFixed(2).replace('.00','')+' €';const total=()=>products.reduce((sum,p)=>sum+p.price*(state.cart[p.id]||0),0);const count=()=>Object.values(state.cart).reduce((s,q)=>s+q,0);

try{state.cart=JSON.parse(localStorage.getItem('ciger_demo_cart')||'{}');state.lang=localStorage.getItem('ciger_demo_lang')||'en';}catch(e){};
if(!translations[state.lang])state.lang='en';for(const key of Object.keys(state.cart)){if(!products.some(p=>p.id===Number(key)))delete state.cart[key]};$('lang').value=state.lang;

async function submit(){let name=$('customer').value.trim(),phone=$('phone').value.trim(),zone=$('zone').value,address=$('address').value.trim(),notes=$('notes').value.trim();if(!name||!phone||!zone||!address){alert(t('missing'));return}if(zone==='a'&&total()<20){alert(t('below'));return}const initData=window.Telegram?.WebApp?.initData||'';if(!initData){alert('Open this menu from the Telegram bot to send an order.');return}const b=$('send');b.disabled=true;b.textContent='…';try{let r=await fetch(workerURL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData,name,phone,zone,address,notes,items:products.filter(p=>state.cart[p.id]>0).map(p=>({id:p.id,qty:state.cart[p.id]}))})});let j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'Order failed');saveProfile({name,phone,zone,address});state.cart={};save();state.page='orders';render();}catch(e){alert(e.message);b.disabled=false;b.textContent=t('send')}}

 try{

 }catch(err){if(state.page==='orders')$('orderList').textContent=t('trackingError')}
