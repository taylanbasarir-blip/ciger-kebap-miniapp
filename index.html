<html lang="en"><head><script src="https://telegram.org/js/telegram-web-app.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>1 Ciğer & 1 Kebap · Menu</title><style>
:root{--bg:#f6f5f1;--ink:#241e19;--red:#a52c26;--muted:#766f67;--line:#e7e2da;--white:#fff;--green:#176d46}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.shell{max-width:620px;margin:0 auto;min-height:100dvh;padding-bottom:92px}.hero{background:#291c18;color:#fff;padding:23px 18px 18px;border-radius:0 0 26px 26px}.eyebrow{font-size:11px;letter-spacing:2.5px;color:#e0b5a5}.hero h1{font-size:25px;margin:7px 0 3px}.hero p{margin:0;color:#edd8cf;font-size:13px}.top{display:flex;justify-content:space-between;gap:12px;align-items:start}.lang{border-radius:11px;background:#49312b;color:#fff;border:1px solid #73534a;padding:8px 10px}.delivery{margin:16px 18px 10px;background:#fff;padding:12px 14px;border-radius:15px;border:1px solid var(--line);font-size:13px}.delivery strong{display:block;margin-bottom:3px}.cats{display:flex;overflow-x:auto;gap:8px;padding:8px 18px 12px;scrollbar-width:none}.cats button{white-space:nowrap;border:1px solid var(--line);border-radius:100px;background:#fff;padding:9px 13px;color:var(--ink)}.cats button.active{background:var(--red);color:#fff;border-color:var(--red)}.heading{padding:5px 18px 4px;display:flex;justify-content:space-between;align-items:end}.heading h2{font-size:21px;margin:0}.heading small{color:var(--muted)}.products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:10px 18px 22px}.item{background:#fff;overflow:hidden;border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column}.art{height:136px;background:linear-gradient(140deg,#e5c9a5,#c57a4e);display:flex;align-items:center;justify-content:center;font-size:58px}.art.lah{background:linear-gradient(140deg,#ebc99e,#ba613b)}.art.wrap{background:linear-gradient(140deg,#e2ca9a,#99a65b)}.art.chick{background:linear-gradient(140deg,#f1cd81,#b97332)}.art.liver{background:linear-gradient(140deg,#ddb18c,#854b39)}.art.meze{background:linear-gradient(140deg,#f2dcaf,#9dbb81)}.info{padding:12px;flex:1;display:flex;flex-direction:column;gap:7px}.info h3{margin:0;font-size:15px;line-height:1.25}.info p{font-size:11px;color:var(--muted);margin:0;flex:1}.buy{display:flex;align-items:center;justify-content:space-between;gap:7px}.buy strong{font-size:18px}.add{background:var(--green);color:#fff;border:0;border-radius:12px;padding:6px 13px;font-size:22px}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(620px,100%);background:#fff;border-top:1px solid var(--line);display:flex;padding:12px 18px max(12px,env(safe-area-inset-bottom));gap:10px;z-index:10}.nav{flex:1;border:0;border-radius:12px;background:#f3f1ec;padding:12px 10px}.nav.active{background:#f8e8e4;color:var(--red);font-weight:700}.cart-pill{background:var(--red);color:white;border:0;border-radius:12px;padding:12px 17px;font-weight:700}.panel{padding:12px 18px 30px}.notice{padding:13px;background:#fff5df;border:1px solid #f0dca7;border-radius:12px;color:#72551c;font-size:13px;margin-bottom:12px}.cartrow{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:14px 0;gap:10px}.qty{display:flex;align-items:center;gap:10px}.qty button{border:1px solid var(--line);background:#fff;width:32px;height:32px;border-radius:9px}.field{display:block;margin-top:14px;font-size:13px;font-weight:600}.field input,.field select,.field textarea{width:100%;margin-top:6px;border-radius:11px;padding:12px;border:1px solid #d7d2cb;background:#fff}.field textarea{min-height:70px}.total{margin:18px 0;font-weight:750;font-size:20px;display:flex;justify-content:space-between}.primary{background:var(--red);color:#fff;border:0;padding:15px;border-radius:12px;width:100%;font-weight:750}.primary:disabled{opacity:.45;cursor:not-allowed}.help{font-size:12px;color:var(--muted);line-height:1.45}.output{white-space:pre-wrap;word-wrap:break-word;background:#fff;padding:14px;border-radius:12px;border:1px solid var(--line);font-size:13px;margin-top:12px}.empty{text-align:center;color:var(--muted);padding:35px 0}.status{text-align:center;padding:45px 12px}.status h2{margin:7px 0} .actions{display:flex;gap:8px;margin-top:10px}.actions button{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line);background:#fff} .actions button:last-child{background:var(--green);color:#fff;border-color:var(--green)}
</style></head><body><main class="shell"><header class="hero"><div class="top"><div><div class="eyebrow">FROM TARSUS TO TIVAT</div><h1>1 Ciğer & 1 Kebap</h1><p id="subtitle">Turkish charcoal grill · Tivat</p></div><select id="lang" class="lang" aria-label="Language"><option value="en">EN</option><option value="me">ME</option><option value="ru">RU</option></select></div></header><section class="delivery"><strong id="delivery-title">Direct ordering · Restaurant prices</strong><span id="delivery-text">Tivat · Kotor · Herceg Novi | Daily 11:00–22:00</span></section><div id="content"></div><nav class="bottom"><button class="nav active" id="menuTab">☰ <span id="menuTabLabel">Menu</span></button><button class="nav" id="cartTab">🛒 <span id="cartTabLabel">Cart</span></button><button class="cart-pill" id="cartCount">0 · 0 €</button></nav></main><script>
const translations={en:{subtitle:'Turkish charcoal grill · Tivat',direct:'Direct ordering · Restaurant prices',places:'Tivat · Kotor · Herceg Novi | Daily 11:00–22:00',menu:'Menu',cart:'Cart',all:'All',kebab:'Kebabs',tantuni:'Tantuni',other:'Others',meze:'Sides',items:'dishes',add:'Add',empty:'Your cart is empty',sum:'Total',name:'Your name',phone:'Phone number',zone:'Delivery area',address:'Delivery address',notes:'Notes (optional)',order:'Prepare order',choose:'Select area',a:'Tivat center / nearby',b:'Other Tivat areas',c:'Kotor',d:'Herceg Novi',min:'Tivat center: minimum order €20. Other areas: delivery availability and minimum to be confirmed.',warn:'This is a demo. No order is sent to the restaurant.',ready:'Order text is ready',copy:'Copy order',whats:'Open WhatsApp',delivery:'Delivery',orderid:'DEMO ORDER — NOT SENT',total:'Total',missing:'Enter your name, phone and delivery address.',below:'The Tivat center minimum order is €20.',manual:'Copy the order text or open WhatsApp, then paste and send it yourself. Telegram integration will come later.',disclaimer:'Photos are placeholders; actual menu images can be added later.'},me:{subtitle:'Turska jela sa roštilja · Tivat',direct:'Direktno naručivanje · Cijene iz restorana',places:'Tivat · Kotor · Herceg Novi | Svaki dan 11:00–22:00',menu:'Meni',cart:'Korpa',all:'Sve',kebab:'Kebabi',tantuni:'Tantuni',other:'Ostalo',meze:'Prilozi',items:'jela',add:'Dodaj',empty:'Vaša korpa je prazna',sum:'Ukupno',name:'Ime',phone:'Broj telefona',zone:'Zona dostave',address:'Adresa za dostavu',notes:'Napomena (opciono)',order:'Pripremi narudžbinu',choose:'Izaberite zonu',a:'Centar Tivta / blizina',b:'Ostali djelovi Tivta',c:'Kotor',d:'Herceg Novi',min:'Centar Tivta: minimalna narudžbina 20 €. Za ostale zone provjeravamo mogućnost dostave i minimum.',warn:'Ovo je demo. Narudžbina se ne šalje restoranu.',ready:'Tekst narudžbine je spreman',copy:'Kopiraj narudžbinu',whats:'Otvori WhatsApp',delivery:'Dostava',orderid:'DEMO NARUDŽBINA — NIJE POSLATA',total:'Ukupno',missing:'Unesite ime, telefon i adresu.',below:'Minimalna narudžbina za centar Tivta je 20 €.',manual:'Kopirajte tekst ili otvorite WhatsApp pa ga sami pošaljite. Telegram integracija slijedi.',disclaimer:'Fotografije su privremeno zamijenjene simbolima; stvarne slike ćemo dodati kasnije.'},ru:{subtitle:'Турецкая кухня на углях · Тиват',direct:'Прямой заказ · Цены ресторана',places:'Тиват · Котор · Херцег-Нови | Ежедневно 11:00–22:00',menu:'Меню',cart:'Корзина',all:'Все',kebab:'Кебабы',tantuni:'Тантуни',other:'Другое',meze:'Закуски',items:'блюд',add:'Добавить',empty:'Корзина пуста',sum:'Итого',name:'Ваше имя',phone:'Номер телефона',zone:'Зона доставки',address:'Адрес доставки',notes:'Комментарий (необязательно)',order:'Подготовить заказ',choose:'Выберите зону',a:'Центр Тивата / рядом',b:'Другие районы Тивата',c:'Котор',d:'Херцег-Нови',min:'Центр Тивата: минимальный заказ 20 €. Другие районы: возможность доставки и минимум уточняются.',warn:'Это демоверсия. Заказ не отправляется в ресторан.',ready:'Текст заказа готов',copy:'Скопировать заказ',whats:'Открыть WhatsApp',delivery:'Доставка',orderid:'ДЕМО-ЗАКАЗ — НЕ ОТПРАВЛЕН',total:'Итого',missing:'Укажите имя, телефон и адрес доставки.',below:'Минимальный заказ для центра Тивата — 20 €.',manual:'Скопируйте заказ или откройте WhatsApp и отправьте его самостоятельно. Подключение Telegram позже.',disclaimer:'Пока используются значки вместо фотографий. Настоящие фотографии добавим позже.'}};
const products=[{id:1,cat:'kebab',price:20,icon:'🍢',css:'',en:'Lamb skewers',me:'Jagnjeći ražnjići',ru:'Шашлык из баранины'},{id:2,cat:'kebab',price:20,icon:'🔥',css:'lah',en:'Adana kebab (lamb)',me:'Adana kebab (jagnjetina)',ru:'Адана-кебаб (баранина)'},{id:3,cat:'kebab',price:15,icon:'🍢',css:'liver',en:'Lamb liver skewers',me:'Ražnjići od jagnjeće džigerice',ru:'Шашлык из бараньей печени'},{id:4,cat:'kebab',price:15,icon:'🍗',css:'chick',en:'Chicken skewers',me:'Pileći ražnjići',ru:'Куриный шашлык'},{id:5,cat:'tantuni',price:10,icon:'🥙',css:'wrap',en:'Beef tantuni sandwich',me:'Sendvič sa goveđim tantunijem',ru:'Тантуни с говядиной (сэндвич)'},{id:6,cat:'tantuni',price:9,icon:'🌯',css:'wrap',en:'Beef tantuni wrap',me:'Tantuni sa govedinom u tortilji',ru:'Тантуни с говядиной (лаваш)'},{id:7,cat:'tantuni',price:9,icon:'🥙',css:'wrap',en:'Chicken tantuni sandwich',me:'Sendvič sa pilećim tantunijem',ru:'Тантуни с курицей (сэндвич)'},{id:8,cat:'tantuni',price:8,icon:'🌯',css:'wrap',en:'Chicken tantuni wrap',me:'Tantuni sa piletinom u tortilji',ru:'Тантуни с курицей (лаваш)'},{id:9,cat:'other',price:6,icon:'🫓',css:'lah',en:'Lahmacun',me:'Lahmadžun',ru:'Лахмаджун'},{id:10,cat:'other',price:15,icon:'🥩',css:'liver',en:'Grilled meatballs',me:'Ćufte sa roštilja',ru:'Кёфте на гриле'}];
const state={lang:'en',cat:'all',page:'menu',cart:{},prepared:''};const $=x=>document.getElementById(x);const t=k=>translations[state.lang][k];const money=n=>n.toFixed(2).replace('.00','')+' €';const count=()=>Object.values(state.cart).reduce((a,b)=>a+b,0);const total=()=>products.reduce((s,p)=>s+p.price*(state.cart[p.id]||0),0);function save(){try{localStorage.setItem('ciger_demo_cart',JSON.stringify(state.cart));localStorage.setItem('ciger_demo_lang',state.lang)}catch(e){}}try{state.cart=JSON.parse(localStorage.getItem('ciger_demo_cart')||'{}');state.lang=localStorage.getItem('ciger_demo_lang')||'en'}catch(e){};if(!translations[state.lang])state.lang='en';$('lang').value=state.lang;
function sync(){ $('subtitle').textContent=t('subtitle');$('delivery-title').textContent=t('direct');$('delivery-text').textContent=t('places');$('menuTabLabel').textContent=t('menu');$('cartTabLabel').textContent=t('cart');$('cartCount').textContent=count()+' · '+money(total());$('menuTab').classList.toggle('active',state.page==='menu');$('cartTab').classList.toggle('active',state.page==='cart');}
function add(id,d=1){state.cart[id]=Math.max(0,(state.cart[id]||0)+d);if(!state.cart[id])delete state.cart[id];save();render()}
function menu(){let cats=['all','kebab','tantuni','other'];$('content').innerHTML=`<div class="cats">${cats.map(c=>`<button class="${state.cat===c?'active':''}" data-cat="${c}">${t(c)}</button>`).join('')}</div><div class="heading"><h2>${t(state.cat)}</h2><small>${products.filter(p=>state.cat==='all'||p.cat===state.cat).length} ${t('items')}</small></div><div class="products">${products.filter(p=>state.cat==='all'||p.cat===state.cat).map(p=>`<article class="item"><div class="art ${p.css}" aria-label="Placeholder">${p.icon}</div><div class="info"><h3>${p[state.lang]}</h3><p>${t('disclaimer')}</p><div class="buy"><strong>${money(p.price)}</strong><button class="add" aria-label="${t('add')}: ${p[state.lang]}" data-add="${p.id}">+</button></div></div></article>`).join('')}</div>`;document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{state.cat=b.dataset.cat;render()});document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>add(+b.dataset.add))}
function cart(){let cs=products.filter(p=>state.cart[p.id]);$('content').innerHTML=`<div class="panel"><h2>${t('cart')}</h2><div class="notice">${t('warn')}</div>${cs.length?cs.map(p=>`<div class="cartrow"><div><b>${p[state.lang]}</b><div style="color:var(--muted)">${money(p.price)}</div></div><div class="qty"><button data-less="${p.id}">−</button><b>${state.cart[p.id]}</b><button data-more="${p.id}">+</button></div></div>`).join(''):`<div class="empty">${t('empty')}</div>`}<div class="total"><span>${t('sum')}</span><span>${money(total())}</span></div><p class="help">${t('min')}</p><label class="field">${t('name')}<input id="customer" autocomplete="name" placeholder="..."></label><label class="field">${t('phone')}<input id="phone" inputmode="tel" autocomplete="tel" placeholder="+382..."></label><label class="field">${t('zone')}<select id="zone"><option value="">${t('choose')}</option>${['a','b','c','d'].map(z=>`<option value="${z}">${t(z)}</option>`).join('')}</select></label><label class="field">${t('address')}<textarea id="address" placeholder="..."></textarea></label><label class="field">${t('notes')}<textarea id="notes"></textarea></label><button class="primary" id="prepare" ${!cs.length?'disabled':''}>${t('order')}</button><div id="result"></div></div>`;document.querySelectorAll('[data-less]').forEach(b=>b.onclick=()=>add(+b.dataset.less,-1));document.querySelectorAll('[data-more]').forEach(b=>b.onclick=()=>add(+b.dataset.more));$('prepare').onclick=prepare}
function prepare(){let customer=$('customer').value.trim(),phone=$('phone').value.trim(),zone=$('zone').value,address=$('address').value.trim(),notes=$('notes').value.trim();if(!customer||!phone||!address||!zone){alert(t('missing'));return}if(zone==='a'&&total()<20){alert(t('below'));return}let s=`${t('orderid')}\n\n${products.filter(p=>state.cart[p.id]).map(p=>`${state.cart[p.id]} × ${p[state.lang]} — ${money(p.price*state.cart[p.id])}`).join('\n')}\n\n${t('total')}: ${money(total())}\n${t('name')}: ${customer}\n${t('phone')}: ${phone}\n${t('delivery')}: ${t(zone)}\n${t('address')}: ${address}${notes?'\n'+t('notes')+': '+notes:''}`;state.prepared=s;let r=$('result');r.innerHTML=`<div class="output" id="orderText"></div><p class="help">${t('manual')}</p><div class="actions"><button id="copy">${t('copy')}</button><button id="wa">${t('whats')}</button></div>`;$('orderText').textContent=s;$('copy').onclick=()=>{navigator.clipboard?.writeText(s).then(()=>alert(t('copy'))).catch(()=>prompt('Copy:',s))};$('wa').onclick=()=>window.open('https://wa.me/38269500355?text='+encodeURIComponent(s),'_blank')}
function render(){sync();state.page==='menu'?menu():cart()};$('lang').onchange=e=>{state.lang=e.target.value;save();render()};$('menuTab').onclick=()=>{state.page='menu';render();window.scrollTo(0,0)};$('cartTab').onclick=$('cartCount').onclick=()=>{state.page='cart';render();window.scrollTo(0,0)};render();



prepare = async function () {
  const name = $('customer').value.trim();
  const phone = $('phone').value.trim();
  const zone = $('zone').value;
  const address = $('address').value.trim();
  const notes = $('notes').value.trim();

  if (!name || !phone || !zone || !address) {
    alert(t('missing'));
    return;
  }
  if (zone === 'a' && total() < 20) {
    alert(t('below'));
    return;
  }

  const initData = window.Telegram?.WebApp?.initData;
  if (!initData) {
    alert('Please open this menu inside Telegram.');
    return;
  }

  const button = $('prepare');
  button.disabled = true;
  button.textContent = 'Sending...';

  try {
    const response = await fetch(
      'https://ciger-kebap-orders.taylanbasarir.workers.dev/order',
      {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          initData,
          name,
          phone,
          zone,
          address,
          notes,
          items: products
            .filter(p => state.cart[p.id] > 0)
            .map(p => ({
              id: p.id,
              qty: state.cart[p.id]
            }))
        })
      }
    );

    const result = await response.json();

    if (!response.ok || !result.ok) {
      throw new Error(result.error || 'Order failed');
    }

    $('result').textContent =
      'Order request sent to restaurant. Await confirmation.';

    state.cart = {};
    save();
    button.textContent = 'Order sent';
  } catch (error) {
    alert(error.message);
    button.disabled = false;
    button.textContent = 'Place Order';
  }
};
</script></body></html>
