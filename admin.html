<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#291c18"><script src="https://telegram.org/js/telegram-web-app.js"></script><title>1 Ciğer & 1 Kebap — Yönetim</title><style>
:root{font-family:system-ui,sans-serif;color:#231b17;background:#f8f5ef}*{box-sizing:border-box}body{margin:0}main{max-width:650px;margin:auto;padding:20px 16px 50px}h1{font-size:23px}p{color:#5e5650}button,input,textarea,select{font:inherit}button{padding:10px 14px;border:0;border-radius:9px;cursor:pointer;background:#a12f29;color:white}button:disabled{opacity:.5}.secondary{background:#eee7df;color:#2b211c}.danger{background:#8e2525}header{display:flex;justify-content:space-between;align-items:center;gap:9px}.list{display:grid;gap:10px}.item{display:flex;align-items:center;gap:12px;background:white;border:1px solid #e5ded5;border-radius:13px;padding:10px}.item img{height:64px;width:64px;object-fit:cover;border-radius:9px;background:#f1ece4}.info{flex:1;min-width:0}.info b{display:block;overflow:hidden;text-overflow:ellipsis}.small{color:#777;font-size:13px}.status{font-weight:700;color:#a12f29;font-size:12px}.modal{background:#fff;border:1px solid #e5ded5;border-radius:13px;padding:18px;margin:14px 0}label{display:block;margin:13px 0 4px;font-size:13px;font-weight:650}input,textarea,select{width:100%;border-radius:9px;padding:11px;border:1px solid #d8cfc3;background:#fff}textarea{min-height:75px}input[type=checkbox]{width:auto;margin-right:8px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.hidden{display:none!important}.flash{padding:10px;border-radius:9px;background:#f7e6d9;color:#67271a;margin:12px 0;white-space:pre-wrap}.preview{max-height:160px;max-width:100%;border-radius:10px}.upload{margin-top:12px}
</style></head><body><main><header><h1>Restoran Yönetimi</h1><a href="index.html">Menü</a></header><p>Ürünler • Fiyatlar • Fotoğraflar • SOLD OUT</p><div id="msg" class="flash">Telegram yöneticisi doğrulanıyor…</div><section id="app" class="hidden"><button id="newBtn">+ Yeni ürün</button><section id="edit" class="modal hidden"><h2 id="heading">Ürün düzenle</h2><label>Kategori<select id="cat"><option value="kebab">Kebaplar</option><option value="tantuni">Tantuni</option><option value="other">Lahmacun / Diğer</option><option value="meze">Mezeler</option><option value="salad">Salata / Garnitür</option><option value="drink">İçecekler</option></select></label><label>Ürün adı (Türkçe)<input id="tr" maxlength="120" required></label><label>İngilizce<input id="en" maxlength="120" required></label><label>Karadağca<input id="me" maxlength="120" required></label><label>Rusça<input id="ru" maxlength="120" required></label><label>Fiyat (€)<input id="price" type="number" min="0" max="10000" step="0.01"></label><label>Gramaj (örn. 150 g)<input id="grams" maxlength="50"></label><label>İçerik / açıklama<textarea id="description" maxlength="1000"></textarea></label><label><input type="checkbox" id="available" checked> Satışta (işareti kaldırınca SOLD OUT)</label><label>Fotoğraf bağlantısı<input id="img" maxlength="400" placeholder="images/urun.jpg veya fotoğraf URL'si"></label><img id="preview" class="preview hidden" alt="Ürün fotoğrafı"><label class="upload">Yeni fotoğraf yükle (JPG, PNG, WebP · en fazla 5 MB)<input id="file" type="file" accept="image/jpeg,image/png,image/webp"></label><div class="actions"><button id="save">Kaydet</button><button id="cancel" class="secondary">Vazgeç</button><button id="remove" class="danger hidden">Ürünü menüden kaldır</button></div></section><h2>Menüdeki ürünler</h2><div id="list" class="list"></div></section></main><script>
const base='https://ciger-kebap-orders.taylanbasarir.workers.dev';const tg=window.Telegram?.WebApp;tg?.ready();const initData=tg?.initData||'';const $=id=>document.getElementById(id);let products=[],selected=null;let busy=false;
function msg(s,err=false){$('msg').textContent=s;$('msg').classList.remove('hidden');$('msg').style.background=err?'#ffe8e6':'#e8f6ec';$('msg').style.color=err?'#8e2525':'#195b35'}
async function request(path,data,method='POST'){const r=await fetch(base+path,{method,headers:{'Content-Type':'application/json'},body:JSON.stringify({initData,...data})});let j=await r.json().catch(()=>({error:'Invalid server response'}));if(!r.ok||!j.ok)throw Error(j.error||'Request failed');return j}
async function refresh(){let r=await fetch(base+'/catalog',{cache:'no-store'});let j=await r.json();if(!r.ok||!j.ok)throw Error('Ürünler yüklenemedi');products=j.products;render()}
function safe(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){$('list').innerHTML=products.map(p=>`<div class="item"><img src="${safe(p.img||'')}" alt="" onerror="this.style.visibility='hidden'"><div class="info"><b>${safe(p.tr)}</b><span class="small">${Number(p.price).toFixed(2)} € · ${safe(p.cat)}</span>${!p.available?'<div class="status">SOLD OUT</div>':''}</div><button data-edit="${p.id}" class="secondary">Düzenle</button></div>`).join('');document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openForm(products.find(p=>p.id===Number(b.dataset.edit))))}
function openForm(p){selected=p?.id||null;for(const k of ['cat','tr','en','me','ru','price','grams','description','img'])$(k).value=p?.[k]??(k==='cat'?'kebab':k==='price'?0:'');$('available').checked=p?.available!==false;$('file').value='';$('heading').textContent=p?'Ürün düzenle':'Yeni ürün ekle';$('remove').classList.toggle('hidden',!p);$('edit').classList.remove('hidden');preview();$('edit').scrollIntoView({behavior:'smooth',block:'start'})}
function preview(){const value=$('img').value.trim();$('preview').classList.toggle('hidden',!value);if(value)$('preview').src=value.startsWith('images/')?value:value}
$('img').onchange=preview;$('newBtn').onclick=()=>openForm(null);$('cancel').onclick=()=>{$('edit').classList.add('hidden')};
$('save').onclick=async()=>{if(busy)return;const p={};for(const k of ['cat','tr','en','me','ru','grams','description','img'])p[k]=$(k).value.trim();p.price=Number($('price').value);p.available=$('available').checked;if(!['tr','en','me','ru'].every(k=>p[k])){msg('Ürün adları dört dilde de doldurulmalı.',true);return}busy=true;$('save').disabled=true;try{const f=$('file').files[0];if(f){if(f.size>5*1024*1024)throw Error('Fotoğraf 5 MB sınırını aşıyor');const fd=new FormData();fd.append('initData',initData);fd.append('photo',f);const res=await fetch(base+'/admin/photo',{method:'POST',body:fd});const photo=await res.json();if(!res.ok||!photo.ok)throw Error(photo.error||'Photo upload failed');p.img=photo.img}await request(selected?'/admin/products/'+selected:'/admin/products',{product:p},selected?'PUT':'POST');await refresh();$('edit').classList.add('hidden');msg('Ürün kaydedildi. Müşteri menüsü güncellendi.')}catch(e){msg(e.message,true)}finally{busy=false;$('save').disabled=false}};
$('remove').onclick=async()=>{if(!selected||!confirm('Bu ürünü menüden kaldırmak istiyor musun?'))return;try{await request('/admin/products/'+selected,{},'DELETE');await refresh();$('edit').classList.add('hidden');msg('Ürün menüden kaldırıldı.')}catch(e){msg(e.message,true)}};
(async()=>{if(!initData){msg('Bu paneli yalnızca Telegram Mini App içinden aç. Tarayıcıda yönetici oturumu doğrulanmaz.',true);return}try{await request('/admin/check',{});$('app').classList.remove('hidden');await refresh();msg('Yönetici olarak giriş yapıldı.')}catch(e){msg('Erişim reddedildi veya veritabanı hazır değil: '+e.message,true)}})();
</script></body></html>
